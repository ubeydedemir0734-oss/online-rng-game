<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RNG Online</title>
<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#07060e;font-family:'Press Start 2P',monospace;color:#e8e0ff}
#c{display:block;width:100%;height:100%;position:fixed;inset:0;z-index:1}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1030ee,#07060ef8);z-index:200;padding:12px}
.card{position:relative;background:#12081c;border:3px solid #ff66aa;padding:20px;width:min(400px,94vw);box-shadow:0 0 0 3px #440022,0 0 30px #ff66aa44}
.card h1{font-family:'Finger Paint',cursive;color:#ff66aa;text-align:center;font-size:1.6rem;margin-bottom:10px;text-shadow:0 0 12px #ff3388}
.card p{font-size:.42rem;color:#a8c;text-align:center;margin-bottom:10px;line-height:1.6}
.auth-close{position:absolute;top:8px;right:10px;width:32px;height:32px;border:2px solid #f46;background:#3a1020;color:#faa;font-size:.7rem;line-height:1;padding:0;cursor:pointer;font-family:inherit;border-radius:4px}
.auth-close:hover{background:#5a2030}
input,select{width:100%;padding:10px;margin:6px 0;border:2px solid #6633aa;background:#0e0618;color:#fff;font-family:inherit;font-size:.45rem}
button{padding:10px 12px;border:2px solid #ff66aa;background:#220044;color:#ffaaee;font-family:inherit;font-size:.45rem;cursor:pointer}
button:hover{background:#440066}
button.sec{background:#1a1520;border-color:#665;color:#ccc}
button.gold{background:#3a2a10;border-color:#fc6;color:#fe9}
button.danger{background:#3a1020;border-color:#f46;color:#faa}
button.big{width:100%;padding:14px;margin-top:6px;font-size:.55rem}
button.link{background:none;border:none;color:#7af;text-decoration:underline;font-size:.4rem;width:100%;margin-top:8px;cursor:pointer}
.err{color:#f68;font-size:.4rem;min-height:1.2em;margin-top:8px;line-height:1.4}
.hidden{display:none!important}
#topRight{position:fixed;top:12px;right:12px;z-index:60;display:flex;gap:8px;align-items:center}
#topRight button{font-size:.4rem;padding:8px 12px}
#userChip{font-size:.38rem;color:#fc6;border:2px solid #63a;background:#12081cee;padding:8px 10px}
#menuTitle{position:fixed;top:12%;left:50%;transform:translateX(-50%);z-index:41;font-family:'Finger Paint',cursive;font-size:clamp(2rem,8vw,3.2rem);color:#ff66aa;text-shadow:0 0 20px #ff3388,3px 3px 0 #330022;pointer-events:none}
#menuRow{position:fixed;top:54%;left:50%;transform:translate(-50%,-50%);z-index:41;display:flex;gap:16px;align-items:stretch}
.menuBtn{
  position:relative;overflow:hidden;
  width:min(240px,38vw);height:min(110px,22vw);
  border:3px solid #ff66aa;
  font-family:'Finger Paint',cursive;
  font-size:clamp(1.2rem,4vw,1.8rem);
  color:#fff;cursor:pointer;
  text-shadow:0 0 10px #000,2px 2px 0 #000;
  box-shadow:0 0 25px #ff66aa44;
  background-size:cover;background-position:center;
  transition:transform .18s ease, box-shadow .18s ease;
}
.menuBtn:hover{
  transform:scale(1.07);
  box-shadow:0 0 35px #ff66aa88, 0 8px 24px #000a;
}
.menuBtn::before{
  content:"";position:absolute;inset:0;
  background:inherit;background-size:cover;background-position:center;
  filter:blur(3px) brightness(0.75);transform:scale(1.08);
  z-index:0;
}
.menuBtn::after{
  content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,0.45),transparent);
  transform:skewX(-20deg);z-index:2;pointer-events:none;
  transition:none;
}
.menuBtn:hover::after{animation:shine 0.7s ease forwards}
@keyframes shine{0%{left:-120%}100%{left:140%}}
.menuBtn span,.menuBtn .btnLabel{position:relative;z-index:3;pointer-events:none}

#ultiFill{height:100%;width:0%;background:linear-gradient(90deg,#f6a,#fc6)}

function beep(f,d,type,v){
  if(!audioCtx||!sfxGain)return;
  try{
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||"square";o.frequency.value=f;
    g.gain.setValueAtTime(v==null?0.07:v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.connect(g);g.connect(sfxGain);o.start();o.stop(audioCtx.currentTime+d);
  }catch(e){}
}

function doAuth(){
  var u=($("userIn").value||"").trim().toLowerCase();
  var p=$("passIn").value||"";
  $("authErr").textContent="";
  if(u.length<3){$("authErr").textContent="Username en az 3 karakter";return}
  if(p.length<3){$("authErr").textContent="Şifre en az 3 karakter";return}
  if(!/^[a-z0-9_]+$/.test(u)){$("authErr").textContent="Sadece a-z, 0-9 ve _";return}
  var passH=hash(p);
  $("authBtn").disabled=true;

  function finishLogin(data,isNew){
    $("authBtn").disabled=false;
    loginOk(u,data,isNew);
  }
  function fail(msg){
    $("authBtn").disabled=false;
    $("authErr").textContent=msg;
  }

  // LOCAL first — always works offline / file://
  var loc=localGet(u);
  if(loc){
    if(loc.ban) return fail("Banlı hesap");
    if(String(loc.pass)!==String(passH)) return fail("Şifre yanlış");
    // optional firebase refresh (don't block)
    if(db){
      try{
        db.ref("rbg/accounts/"+u).once("value").then(function(s){
          var d=s.val();
          if(d && !d.ban && String(d.pass)===String(passH)) localSet(u,d);
        }).catch(function(){});
      }catch(e){}
    }
    finishLogin(loc,false);
    return;
  }

  // NEW account: create locally immediately
  var data=createData(u,passH);
  try{ localSet(u,data); }catch(e){ return fail("Kayıt hatası: localStorage"); }

  // Try firebase in background (with timeout so UI never hangs)
  if(db){
    var done=false;
    function afterFb(){ if(done)return; done=true; finishLogin(data,true); }
    try{
      var t=setTimeout(afterFb, 2500);
      db.ref("rbg/accounts/"+u).once("value").then(function(s){
        var d=s.val();
        if(d){
          clearTimeout(t);
          if(d.ban){ done=true; try{var a=localGetAll();delete a[u];localSaveAll(a)}catch(e){} return fail("Banlı hesap"); }
          if(String(d.pass)!==String(passH)){ done=true; return fail("Şifre yanlış"); }
          localSet(u,d);
          done=true; finishLogin(d,false);
          return;
        }
        return db.ref("rbg/accounts/"+u).set(data).then(function(){
          clearTimeout(t); afterFb();
        }).catch(function(){ clearTimeout(t); afterFb(); toast("Yerel kayıt"); });
      }).catch(function(){ clearTimeout(t); afterFb(); toast("Yerel kayıt"); });
    }catch(e){ afterFb(); }
  }else{
    finishLogin(data,true);
  }
}

  if(document.activeElement===$("chatIn"))return;
  if(e.code==="Space"){e.preventDefault();doDash()}
  if(e.code==="Digit1")cast(0);if(e.code==="Digit2")cast(1);if(e.code==="Digit3")cast(2);if(e.code==="Digit4")cast(3);

});

  if(me.style==="melee"){damageCircle(me.x,me.y,120,d*3.0,me.id);boom(me.x,me.y,col,14);sfxSlash();toast(me.ultiName);return}
  if(me.style==="beam"){for(var k=-2;k<=2;k++)projectiles.push(proj(me,a+k*0.08,16,d*1.5,col,.7,false,"beam"));toast(me.ultiName);return}
  if(me.style==="dashhit"){for(var i=0;i<3;i++){(function(i){setTimeout(function(){if(!me)return;me.x+=Math.cos(me.ang)*80;damageCircle(me.x,me.y,55,d*1.2,me.id);boom(me.x,me.y,col,6)},i*80)})(i)}toast(me.ultiName);return}
  damageCircle(me.x,me.y,150,d*2.5,me.id);boom(me.x,me.y,"#fc6",12);toast(me.ultiName||"ULTI");
}
function damageCircle(x,y,r,dmg,from){bots.forEach(function(b){if(Math.hypot(b.x-x,b.y-y)<r)hit(b,dmg,from)});Object.keys(others).forEach(function(k){var o=others[k];if(o&&o.alive!==false&&Math.hypot(o.x-x,o.y-y)<r&&db)db.ref("rbg/hits").push({to:k,from:acc.user,dmg:dmg,ts:Date.now()})})}
function damageCone(x,y,ang,fov,range,dmg,from){bots.forEach(function(b){var dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy);if(d>range)return;var a=Math.atan2(dy,dx),diff=Math.atan2(Math.sin(a-ang),Math.cos(a-ang));if(Math.abs(diff)<fov/2)hit(b,dmg,from)})}
function hit(e,dmg,from){if(god&&e===me)return;e.hp-=dmg;boom(e.x,e.y,"#f55",4);sfxHit();if(e.hp<=0){e.hp=0;if(e.bot){bots=bots.filter(function(b){return b!==e});if(from===acc.user){acc.money+=25;me.ulti=Math.min(100,(me.ulti||0)+30);saveAcc();sfxCoin();toast("+25")}}}}
function killMe(){if(god){me.hp=me.maxHp;return}me.hp=0;deadUntil=performance.now()+3000;$("respawnMsg").style.display="block";$("respawnMsg").textContent="3 saniye içinde canlanıyorsun...";setTimeout(function(){if(!me)return;me.hp=me.maxHp;me.x=W/2+rand(-80,80);me.y=H/2+rand(-80,80);deadUntil=0;$("respawnMsg").style.display="none"},3000)}
setInterval(function(){
  if(!db||state!=="game"||!me||!acc)return;
  db.ref("rbg/hits").orderByChild("ts").startAt(Date.now()-2000).once("value").then(function(s){
    var v=s.val();if(!v)return;
    Object.keys(v).forEach(function(k){var h=v[k];if(h.to===acc.user&&!god&&!deadUntil){me.hp-=h.dmg||10;db.ref("rbg/hits/"+k).remove();if(me.hp<=0)killMe()}});
  });
},350);
function boom(x,y,c,n){for(var i=0;i<n;i++)particles.push({x:x,y:y,vx:rand(-3,3),vy:rand(-3,3),life:.35,color:c,s:2+Math.random()*3})}

var last=performance.now();
function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;if(state==="game"&&me&&!paused)update(dt);if(state==="game"&&me)draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function update(dt){
  if(deadUntil){var left=Math.ceil((deadUntil-performance.now())/1000);$("respawnMsg").textContent="3 saniye içinde canlanıyorsun... ("+Math.max(0,left)+")";return}
  // freeze zones
  var now=performance.now();
  freezeZones=freezeZones.filter(function(z){return z.until>now});
  me.frozen=false;
  bots.forEach(function(b){b.frozen=false});
  freezeZones.forEach(function(z){
    if(Math.hypot(me.x-z.x,me.y-z.y)<z.r){ if(!noStun&&!god) me.frozen=true; }
    bots.forEach(function(b){ if(Math.hypot(b.x-z.x,b.y-z.y)<z.r) b.frozen=true; });
  });
  if(standFx){standFx.life-=dt;standFx.x=me.x-Math.cos(me.ang)*28;standFx.y=me.y-Math.sin(me.ang)*28;standFx.ang=me.ang;if(standFx.life<=0)standFx=null}
  var mx=0,my=0;
  if(!(me.frozen&&!noStun)){
    if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
  }
  if(mx||my){var l=Math.hypot(mx,my);mx/=l;my/=l}
  me.x=Math.max(20,Math.min(W-20,me.x+mx*me.spd*60*dt));me.y=Math.max(20,Math.min(H-20,me.y+my*me.spd*60*dt));
  var camX=me.x-canvas.width/2,camY=me.y-canvas.height/2;
  me.ang=Math.atan2((mouse.y+camY)-me.y,(mouse.x+camX)-me.x);
  if(me.dash>0)me.dash-=dt;if(me.inv>0)me.inv-=dt;me.cds=me.cds.map(function(c){return Math.max(0,c-dt)});
  if(mouse.down&&performance.now()-lastShot>240&&!(me.frozen&&!noStun)){
    lastShot=performance.now();var st=me.style,id=me.charId;
    if(st==="melee"||id==="kratos"||id==="cj"||id==="steve"||id==="gordon"){sfxSlash();damageCone(me.x,me.y,me.ang,1.0,62,me.dmg,me.id);boom(me.x+Math.cos(me.ang)*32,me.y+Math.sin(me.ang)*32,me.color,4)}
    else if(st==="barrage"||id==="dio"){projectiles.push(proj(me,me.ang,9,me.dmg*.75,"#e8c",.3,true,"fist"));beep(320,0.025)}
    else if(st==="beam"||id==="gojo"||id==="chief"||id==="v1"){projectiles.push(proj(me,me.ang,13,me.dmg,me.color,.45,false,"beam"));beep(900,0.025)}
    else if(st==="dashhit"||id==="sonic"||id==="hornet"||id==="mj"){sfxSlash();damageCone(me.x,me.y,me.ang,0.9,55,me.dmg*0.95,me.id);boom(me.x+Math.cos(me.ang)*28,me.y+Math.sin(me.ang)*28,me.color,3)}
    else if(st==="trap"||id==="takaba"){damageCone(me.x,me.y,me.ang,.85,52,me.dmg,me.id);beep(400,0.03)}
    else if(id==="luffy"){sfxSlash();damageCone(me.x,me.y,me.ang,0.85,75,me.dmg,me.id);boom(me.x+Math.cos(me.ang)*40,me.y+Math.sin(me.ang)*40,me.color,3)}
    else if(id==="mario"){projectiles.push(proj(me,me.ang,7.5,me.dmg*0.9,"#f44",.5,false,"shot"));beep(550,0.03)}
    else{projectiles.push(proj(me,me.ang,8,me.dmg,me.color,.4,false,"shot"));beep(650,0.03)}
  }
  projectiles.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.life-=dt;if(p.kind==="trap"){p.vx=0;p.vy=0}
    bots.forEach(function(b){if(p.from!==b.id&&Math.hypot(p.x-b.x,p.y-b.y)<(p.r+14)){hit(b,p.dmg,p.from);if(p.kind!=="trap")p.life=0}});
    if(p.from!==acc.user&&Math.hypot(p.x-me.x,p.y-me.y)<(p.r+14)&&me.inv<=0&&!god&&!deadUntil){me.hp-=p.dmg;if(p.kind!=="trap")p.life=0;if(me.hp<=0)killMe()}
  });
  projectiles=projectiles.filter(function(p){return p.life>0});
  particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.life-=dt});particles=particles.filter(function(p){return p.life>0});
  bots.forEach(function(b){
    var dx=me.x-b.x,dy=me.y-b.y,d=Math.hypot(dx,dy)||1;b.ang=Math.atan2(dy,dx);
    if(b.frozen){b.cd=1;return}
    b.x+=Math.cos(b.ang)*b.spd*40*dt;b.y+=Math.sin(b.ang)*b.spd*40*dt;b.cd-=dt;
    if(d<210&&b.cd<=0){b.cd=1.05-b.diff*0.004;projectiles.push({x:b.x,y:b.y,vx:Math.cos(b.ang)*6,vy:Math.sin(b.ang)*6,life:1,dmg:b.dmg,color:b.color,from:b.id,r:5,kind:"shot"})}
  });
  if(db&&performance.now()-lastSync>130){lastSync=performance.now();db.ref("rbg/arena/"+acc.user).update({x:me.x,y:me.y,hp:me.hp,maxHp:me.maxHp,charId:me.charId,cos:acc.cos||{},alive:!deadUntil&&me.hp>0,ts:Date.now()})}
  $("moneyBadge").textContent=String(acc.money|0);$("hpBadge").textContent=Math.max(0,me.hp|0)+"/"+me.maxHp;
  $("charBadge").textContent=(CHARS[me.charId]||{}).name||"?";$("ultiFill").style.width=(me.ulti||0)+"%";
  me.cds.forEach(function(c,i){var el=$("ab"+i);if(el)el.classList.toggle("cd",c>0)});
}
function draw(){
  var w=canvas.width,h=canvas.height;ctx.fillStyle="#0a0814";ctx.fillRect(0,0,w,h);
  var camX=me.x-w/2,camY=me.y-h/2;ctx.save();ctx.translate(-camX,-camY);
  ctx.fillStyle="#14101c";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#2a2040";ctx.lineWidth=1;
  for(var x=0;x<=W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(var y=0;y<=H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.strokeStyle="#ff66aa";ctx.lineWidth=4;ctx.shadowColor="#ff66aa";ctx.shadowBlur=10;ctx.strokeRect(2,2,W-4,H-4);ctx.shadowBlur=0;
  Object.keys(others).forEach(function(k){var o=others[k];if(!o||o.alive===false)return;drawBody(o.x,o.y,0,(CHARS[o.charId]&&CHARS[o.charId].color)||"#888",o.hp,o.maxHp,k,o.cos)});
  bots.forEach(function(b){drawBody(b.x,b.y,b.ang,b.color,b.hp,b.maxHp,b.name,null)});
  // freeze zone VFX
  freezeZones.forEach(function(z){
    var left=(z.until-performance.now())/4000;
    ctx.strokeStyle="rgba(200,160,255,"+(0.35+0.4*left)+")";
    ctx.lineWidth=3;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,6.28);ctx.stroke();
    ctx.fillStyle="rgba(120,80,200,"+(0.08+0.1*left)+")";ctx.fill();
  });
  if(standFx){
    ctx.save();
    ctx.globalAlpha=Math.min(1,standFx.life*2)*0.85;
    ctx.fillStyle="#c9f";ctx.shadowColor="#c9f";ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(standFx.x,standFx.y,14,0,6.28);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(standFx.x+Math.cos(standFx.ang)*4,standFx.y+Math.sin(standFx.ang)*4,3,0,6.28);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  }
  if(me.inv>0)ctx.globalAlpha=.5;
  if(me.frozen&&!noStun)ctx.globalAlpha=.55;
  drawBody(me.x,me.y,me.ang,me.color,me.hp,me.maxHp,acc.user,acc.cos);ctx.globalAlpha=1;
  projectiles.forEach(function(p){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.vy,p.vx));ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;
    if(p.fist){ctx.fillRect(-4,-4,11,8);ctx.fillRect(5,-5,4,3);ctx.fillRect(5,0,4,3)}
    else if(p.kind==="beam"){ctx.fillRect(-2,-2,16,4)}
    else if(p.kind==="trap"){ctx.beginPath();ctx.arc(0,0,p.r,0,6.28);ctx.fill()}
    else{ctx.beginPath();ctx.arc(0,0,p.r,0,6.28);ctx.fill()}
    ctx.shadowBlur=0;ctx.restore();
  });
  particles.forEach(function(p){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.s||3,p.s||3);ctx.globalAlpha=1});
  ctx.restore();
}
function drawBody(x,y,ang,col,hp,maxHp,label,cos){
  var bodyCol=col,glove="#f0d0b0",hat=null,aura=null;
  if(cos){if(cos.body&&COSMETICS[cos.body])bodyCol=COSMETICS[cos.body].color;if(cos.glove&&COSMETICS[cos.glove])glove=COSMETICS[cos.glove].color;if(cos.hat&&COSMETICS[cos.hat])hat=COSMETICS[cos.hat];if(cos.aura&&COSMETICS[cos.aura])aura=COSMETICS[cos.aura]}
  if(aura){ctx.strokeStyle=aura.color;ctx.lineWidth=3;ctx.globalAlpha=.45;ctx.beginPath();ctx.arc(x,y,22,0,6.28);ctx.stroke();ctx.globalAlpha=1}
  ctx.fillStyle=bodyCol;ctx.shadowColor=bodyCol;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(x,y,16,0,6.28);ctx.fill();ctx.shadowBlur=0;
  var hx=Math.cos(ang),hy=Math.sin(ang),px=-hy,py=hx,fx=x+hx*14,fy=y+hy*14;
  ctx.fillStyle=glove;ctx.beginPath();ctx.arc(fx+px*7,fy+py*7,5,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(fx-px*7,fy-py*7,5,0,6.28);ctx.fill();
  ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x+hx*5+px*4,y+hy*5+py*4,2.2,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(x+hx*5-px*4,y+hy*5-py*4,2.2,0,6.28);ctx.fill();
  if(hat){ctx.fillStyle=hat.color;ctx.beginPath();ctx.arc(x,y-14,7,0,6.28);ctx.fill()}
  var pct=Math.max(0,hp/(maxHp||1));ctx.fillStyle="#000a";ctx.fillRect(x-18,y-32,36,5);ctx.fillStyle=pct>.4?"#4f8":"#f45";ctx.fillRect(x-18,y-32,36*pct,5);
  ctx.fillStyle="#ffeef8";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillText(label||"",x,y-36);
}

showMenu(true);
state="menu";
})();
</script>
